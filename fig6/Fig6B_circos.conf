# --- CORE INPUTS ---
karyotype = data/Fig6B_karyotype.txt
chromosomes_units = 1000000

# Add this line to make the organelles 4% of the circle each
chromosomes_scale = VN1_cp=0.04r, VN_mito_chr1=0.04r, VN_mito_chr2=0.04r
# --- IDEOGRAM (THE OUTER RING) ---
<ideogram>
<spacing>
default = 0.005r
# You can increase this if you want more space between chromosomes
</spacing>

radius           = 0.85r
thickness        = 40p
fill             = yes
stroke_color     = dgrey
stroke_thickness = 2p

# Display the names of the scaffolds/organelles
show_label       = yes
label_font       = default
label_radius     = 1.05r
label_size       = 30
label_parallel   = yes
</ideogram>

# --- SCALE TICKS ---
show_ticks          = yes
show_tick_labels    = yes

<ticks>
radius           = 1r
color            = black
thickness        = 2p
multiplier       = 1e-6  # Formats labels in Megabases (MB)
format           = %d

<tick>
spacing        = 1u      # Small tick every 1MB
size           = 10p
</tick>

<tick>
spacing        = 5u      # Large tick every 5MB
size           = 15p
show_label     = yes
label_size     = 20p
label_offset   = 10p
format         = %d
</tick>
</ticks>

# --- LINKS (THE INTERGENOMIC TRANSFERS) ---
<links>
<link>
file          = data/Fig6B_links.txt
radius        = 0.84r       # Adjust this to be slightly less than your <ideogram> radius!
bezier_radius = 0.1r
ribbon        = yes         # Turns the lines into solid shapes
flat          = yes         # Removes the 3D outline effect for a modern look
color = eval(sprintf("%s_a1", var(color)))
</link>
</links>

<ideogram>
# ... other settings ...
show_label       = yes
label_radius     = 1.08r    # Pushes labels further out from the black bands
label_size       = 30
</ideogram>

# --- STANDARD CIRCOS SYSTEM INCLUDES ---
# These pull in Circos's default color libraries, fonts, and image settings.
<image>
<<include etc/image.conf>>
</image>

<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>