# --- CORE INPUTS ---
karyotype = data/Fig6B_karyotype.txt
chromosomes_units = 1000000

# Forces the organelles to be 4% of the circle each so they are visible against massive nuclear chromosomes
chromosomes_scale = VN1_cp=0.04r, VN_mito_chr1=0.04r, VN_mito_chr2=0.04r

# --- IDEOGRAM (THE OUTER RING) ---
<ideogram>
<spacing>
default = 0.005r
</spacing>

# Shrunk from 0.85r to 0.80r to create a safe outer margin for labels
radius           = 0.80r
thickness        = 40p
fill             = yes
stroke_color     = dgrey
stroke_thickness = 2p

# Display the names of the scaffolds/organelles (Consolidated settings)
show_label       = yes
label_font       = default
label_radius     = 1.20r    # Pushes labels out from the bands
label_size       = 40
label_parallel   = yes
</ideogram>

# --- SCALE TICKS ---
show_ticks          = yes
show_tick_labels    = yes

<ticks>
radius           = 1r
color            = black
thickness        = 2p
multiplier       = 1e-6  # Formats labels in Megabases (Mb)
format           = %d

<tick>
spacing        = 1u      # Small tick every 1Mb
size           = 10p
</tick>

<tick>
spacing        = 5u      # Large tick every 5Mb
size           = 15p
show_label     = yes
label_size     = 40p
label_offset   = 10p
format         = %d Mb   # Added 'Mb' suffix for clarity
</tick>
</ticks>

# --- LINKS (THE INTERGENOMIC TRANSFERS) ---
<links>
<link>
file          = data/Fig6B_links.txt
# Must be slightly less than the new ideogram radius (0.80r)
radius        = 0.79r       
bezier_radius = 0.2r
ribbon        = yes         # Turns the lines into solid shapes
flat          = yes         # Removes the 3D outline effect for a modern look
color         = eval(sprintf("%s_a1", var(color)))
</link>
</links>

# --- STANDARD CIRCOS SYSTEM INCLUDES ---
<image>
<<include etc/image.conf>>
</image>

<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>