name: visualiz
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Core Languages ---
  - python=3.14.4
  - r-base=4.5.3

  # --- R packages ---
  - r-ggplot2=4.0.3
  - r-sf=1.1_0
  - r-rnaturalearth=1.2.0
  - r-rnaturalearthdata=1.0.0
  - r-ggrepel=0.9.8
  - r-phytools=2.5_2
  - r-ape=5.8_1
  - r-patchwork=1.3.2
  - r-tidyverse=2.0.0
  - bioconductor-ggtree=4.0.4
  - bioconductor-treeio=1.34.0

  # --- Python packages (conda) ---
  - pandas=3.0.2
  - biopython=1.87
  - matplotlib=3.10.9
  - numpy=2.4.3
  - pycirclize=1.10.1
  - dna_features_viewer=3.1.5

  # --- Bioinformatics tools ---
  - circos=0.69.9

  # --- pip-only packages (not available via conda for Python 3.14) ---
  - pip
  - pip:
    - pysam==0.24.0
