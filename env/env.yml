name: visualiz
channels:
  - conda-forge
  - bioconda
  - r
  - defaults
dependencies:
  # --- Core Languages ---
  - python=3.10
  - r-base=4.3.3

  # --- R packages ---
  - r-ggplot2=3.4.4
  - r-sf=1.0.14
  - r-rnaturalearth=1.0.1
  - r-rnaturalearthdata=1.0.0
  - r-ggrepel=0.9.4
  - r-phytools=2.0_3
  - r-ape=5.7_1
  - r-patchwork=1.1.3
  - r-tidyverse=2.0.0
  - r-genoplotr=0.8.11
  - bioconductor-ggtree=3.10.0
  - bioconductor-treeio=1.26.0

  # --- Python packages ---
  - pandas=2.1.4
  - biopython=1.81
  - matplotlib=3.8.2
  - numpy=1.26.2
  - pycirclize=0.3.0
  - dna_features_viewer=3.1.1
  - pysam=0.22.0

  # --- Bioinformatics tools ---
  - circos=0.69.8
