# --- CORE INPUTS ---
karyotype = data/Fig7A_karyotype.txt
chromosomes_units = 1000

# --- IDEOGRAM (THE OUTER RING) ---
<ideogram>
<spacing>
default = 0.02r
</spacing>

# Shrink this from 0.85r to 0.75r to create an outer margin
radius           = 0.75r  
thickness        = 40p
fill             = yes
stroke_color     = dgrey
stroke_thickness = 2p

# Display the names of the organelles
show_label       = yes
label_font       = default
label_radius     = 1.18r
label_size       = 60
label_parallel   = yes
</ideogram>

# --- SCALE TICKS (FORMATTED FOR KILOBASES) ---
show_ticks          = yes
show_tick_labels    = yes

<ticks>
radius           = 1r
color            = black
thickness        = 2p
multiplier       = 1e-3  # Formats labels in Kilobases (kb)
format           = %d

<tick>
spacing        = 10u     # Small tick every 10kb
size           = 10p
</tick>

<tick>
spacing        = 50u     # Large tick every 50kb
size           = 15p
show_label     = yes
label_size     = 40p
label_offset   = 10p
format         = %d kb   # Appends 'kb' to the number
</tick>
</ticks>

# --- LINKS (THE MTPT TRANSFERS) ---
<links>
<link>
file          = data/Fig7A_links.txt
radius        = 0.84r        # Starts just inside the ideogram ring
bezier_radius = 0.2r         # Controls how deep the curves pull into the center
ribbon        = yes          # Draws transfers as actual width of the DNA chunk
flat          = yes          # Removes 3D borders for a clean modern look

# Using a moderate transparency (_a2) to ensure PNG visibility while showing density
color         = eval(sprintf("%s_a2", var(color))) 
</link>
</links>

# --- STANDARD CIRCOS SYSTEM INCLUDES ---
<image>
<<include etc/image.conf>>
</image>

<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>